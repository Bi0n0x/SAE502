<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casino R&T</title>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif;
           background: #120d2b; color: #efeaff;
           display: grid; place-items: center; min-height: 100vh; }
    main { max-width: 34rem; padding: 2rem; }
    code { background: #241a4d; padding: .15em .4em; border-radius: .25rem; }
    #status { margin-top: 1.5rem; padding: 1rem; border-radius: .5rem; background: #1b1440; }
  </style>
</head>
<body>
<main>
  <h1>Casino R&amp;T</h1>
  <p>Le back-end est en place. L'interface arrive.</p>
  <p>Contrat d'API : <code>docs/api.md</code> — catalogue :
     <a href="/api/games" style="color:#bb6bd9">/api/games</a></p>
  <div id="status">Verification du service...</div>
</main>
<script>
  fetch("/api/games", { credentials: "same-origin" })
    .then(r => r.json())
    .then(d => {
      const names = (d.games || []).map(g => g.name).join(", ");
      document.getElementById("status").textContent =
        `API joignable — ${d.games?.length || 0} jeu(x) : ${names}`;
    })
    .catch(() => {
      document.getElementById("status").textContent =
        "API injoignable : verifier le conteneur api.";
    });
</script>
</body>
</html>
