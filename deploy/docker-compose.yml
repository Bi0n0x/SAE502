name: casino-rt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?see .env}
      POSTGRES_DB: ${POSTGRES_DB:-casino}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casino} -d ${POSTGRES_DB:-casino}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [back]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-casino}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casino}?sslmode=disable"
      START_BALANCE: ${START_BALANCE:-1000}
      MIN_BET: ${MIN_BET:-1}
      MAX_BET: ${MAX_BET:-500}
      SESSION_TTL: ${SESSION_TTL:-24h}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RATE_GLOBAL_PER_MIN: ${RATE_GLOBAL_PER_MIN:-300}
      RATE_AUTH_PER_MIN: ${RATE_AUTH_PER_MIN:-10}
      RATE_PLAY_PER_MIN: ${RATE_PLAY_PER_MIN:-120}
      TZ: ${TZ:-Europe/Paris}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [back, front]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    ports:
      - "${WEB_PORT:-8088}:80"
    networks: [front]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    depends_on:
      web:
        condition: service_started
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [front]

volumes:
  db_data:

networks:
  back:
  front:
